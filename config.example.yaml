# Copy to config.yaml and fill in. See README.md for how to get each value.

league_id: 305751
league_instance_id: 305775

# Bradley's fantasyTeamId within this ClickyDraft league instance. Leave
# blank and pass --team-name on the CLI the first time to resolve it from
# the League Settings response instead.
my_team_id:
my_team_name: null

# Wet Willie Brigade: 14 teams.
num_teams: 14

# How often to poll the Picks endpoint during a live draft.
poll_interval_seconds: 1.5

# Path to a CSV of raw per-player stat projections (see data/projections.example.csv).
# Only needed if ClickyDraft's own draftablePlayer.projectedStats field is empty
# for this league instance, which is the case in the one sample response we have.
projections_csv: data/projections.csv

# Optional: generic ADP/overall-rank spreadsheet used ONLY as a fallback
# ordering for players with no stat-based projection above (see README.md
# "Player projections" and "Fallback ranking" — this never overrides the
# custom point-value ranking).
fallback_rankings_xlsx: "data/Top-144 Player Rankings.xlsx"

# Env var holding the raw browser `Cookie` header value (see README.md "Auth").
cookie_env_var: CLICKYDRAFT_COOKIE

# How many recommendations to show at once.
top_n: 15

# Opt-in autopick SAFETY NET — off by default. See README.md "Autopick
# safety net" before turning this on. It only ever submits a pick as a
# last resort when Bradley hasn't picked himself for a while on his own
# turn. There's no ClickyDraft countdown timer to key off of (confirmed
# there isn't one exposed via polling), so this is measured by the tool's
# own wall clock instead: how long IT has observed Bradley's turn sitting
# idle. That means the tool needs to be running continuously through the
# draft for this to mean what it says — see turn_clock.py.
autopick:
  enabled: false
  # Seconds of idle time on Bradley's own turn before it fires (3 minutes).
  wait_seconds: 180
