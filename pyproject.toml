[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickydraft-assistant"
version = "0.1.0"
description = "Live draft recommendation tool for ClickyDraft, scored against custom Yahoo league settings. No auto-draft."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
clickydraft-assistant = "clickydraft_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
